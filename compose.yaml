services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tsoadmin
      POSTGRES_PASSWORD: tsoadmin
      POSTGRES_DB: tsoadmin
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tsoadmin']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
